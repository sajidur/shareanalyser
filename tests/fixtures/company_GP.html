 Directors of the company has declared Interim Cash Dividend for the year 2026 at the rate of 105% of the paid-up capital of the Company which represents 100% of the Profit after Tax for the six-month period ended on 30 June 2026 (BDT 10.50 per share of BDT 10 each), out of the audited net profits of the Company for the six-month period ended 30 June 2026. Record date for entitlement of Interim Cash Dividend is August 12, 2026. (cont.1)\n\n(Cont. news of GP): Accordingly, the Board of Directors has reported audited Q2 Financials as follows: EPS was Tk. 5.62 for April-June 2026 as against Tk. 6.51 for April-June 2025; EPS was Tk. 10.52 for January-June 2026 as against Tk. 11.21 for January-June 2025. NOCFPS was Tk. 22.27 for January-June 2026 as against Tk. 26.94 for January-June 2025. NAV per share was Tk. 41.51 as on June 30, 2026 and Tk. 42.15 as on June 30, 2025. (cont.2)\n\n(Cont. news of GP): Net Operating Cash Flow per Share (NOCFPS) for the quarter ended 30 June 2026 compared to that of comparative period has decreased by 17.3% mainly due to higher payment to supplier in current period (end)29:T5af,"])</script><script>self.__next_f.push([1,"The company has informed that the ongoing geopolitical tensions in the Middle East that have led to significant disruption in global energy markets leaves Bangladesh particularly exposed due to its reliance on imported fuels and LNG. This has resulted in increased volatility in energy supplies, higher fuel import costs, and initial signs of constraints in energy supplies and logistics across the country. (cont.1)\n\n(Cont. News of GP): While the overall operating environment remains stable, these developments, which come on top of a weak macroeconomic environment, have started to impact economic activity and consumer behavior with early signs of pressure on mobility, business operations, and disposable income. Severe seasonal storms have further aggravated the situation. (cont.2)\n\n(Cont. News of GP):  Against this backdrop, the company expects Q1 performance to be moderately impacted. Compared to the same period last year, revenue is anticipated to be approximately 2% lower, while EBITDA is expected to decline by around 3%. (cont.3)\n\n(Cont. News of GP):  The situation remains fluid, and the company continues to actively monitor developments and implement mitigating actions to safeguard service continuity and operational resilience, with a particular focus on maintaining its leading network performance and supporting customers and society during this period. Further details will be provided with the scheduled Q1 2026 disclosure. (end)"])</script><script>self.__next_f.push([1,"2a:T4c8,The company has requested the members to update their respective Bank Account, Address, Mobile Number etc. through their respective Depository Participant (DP) before the Record Date. Members are also requested to update their respective BO Account with 12-digit Taxpayer's identification number (e-TIN) through their respective Depository Participant (DP) before the 'Record Date'. If anyone fails to update e-TIN in BO Account before the 'Record Date', (cont.1)\n\n(Cont. News of GP): disbursement of respective cash dividend will be subject to deduction of advance income Tax (AIT) @ 15% (instead @ 10%) as per regulation.  The concerned Brokerage Houses are requested to provide with a statement with the details (Shareholder neme, BO ID number, Client-wise shareholding position, gross dividend receivable, applicable tax rate, and net dividend receivable) of their margin loan holders who hold company's shares, as on the 'Record Date', (cont.2)\n\n(Cont. News of GP): along with the name of the contact person in this connection, to the Company's Share Office on or before 10 March 2026. The Brokerage Houses are also requested to provide their bank account name \u0026 number, routing number and other relevant details. (end)"])</script><script>self.__next_f.push([1,"23:{\"series\":[{\"t\":\"23 Oct\",\"date\":\"2 y\":\"Trading of the shares of the company will resume on 13-Aug-2026.\"},{\"id\":\"32807935\",\"type\":\"Notice\",\"date\":\"11 Aug 2026\",\"summary\":\"Suspension for Record Date\",\"body\":\"Trading of the shares of the company will remain suspended on record date i.e., 12-Aug-2026.\"},{\"id\":\"32764114\",\"type\":\"Notice\",\"date\":\"09 Aug 2026\",\"summary\":\"Spot News\",\"body\":\"Trading of the shares of the company will be allowed only in the Spot Market and Block transaction will also be settled as per spot settlement cycle with cum benefit from 10.08.2026 to 11.08.2026 and trading of the shares will remain suspended on record date i.e., 12.08.2026.\"},{\"id\":\"32373566\",\"type\":\"Notice\",\"date\":\"20 Jul 2026\",\"summary\":\"Emphasis of Matter\",\"body\":\"The auditor of the company has given the Emphasis of Matter paragraph in the auditor's report for the six month period ended June 30, 2026. To view the details, please visit: https://www.dsebd.org/Auditors_opinion/GP-2026.pdf\"},{\"id\":\"32287167\",\"type\":\"Notice\",\"date\":\"15 Jul 2026\",\"summary\":\"Update of Information\",\"body\":\"The company has requested the members to update their Bank Account, Address, Mobile Number, Email Address etc. through their respective Depository Participant (DP) before the 'Record Date'. Members are also requested to update their respective BO Account with 12 digit Taxpayer's identification number (TIN) through their respective Depository Participant (DP) before the 'Record Date'. (cont.1)\\n\\n(Cont. News of GP): The concerned Brokerage Houses are requested to provide them with a statement with the details (Shareholder name, BO ID number, client-wise shareholding position, gross dividend receivable, applicable tax rate and net dividend receivable) of their margin loan holders who holds GP shares, as on the 'Record Date', along with the name of the contact person in this connection, (cont.2)\\n\\n(Cont. News of GP): to the Company's Share Office on or before 19 August 2026. The Brokerage Houses are also requested to provide with their Bank Account name \u0026 number, routing number etc. (end)\"},{\"id\":\"32287111\",\"type\":\"Notice\",\"date\":\"15 Jul 2026\",\"summary\":\"Price Limit Open\",\"body\":\"There will be no price limit on the trading of the shares of the Company today (15.07.2026) following its corporate declaration.\"},{\"id\":\"32287110\",\"type\":\"Dividend\",\"date\":\"15 Jul 2026\",\"summary\":\"Declaration of Interim Dividend and Audited Q2 Financials\",\"body\":\"$28\"},{\"id\":\"32158515\",\"type\":\"Financials\",\"date\":\"08 Jul 2026\",\"summary\":\"Conference on 2nd Quarter Financial Results\",\"body\":\"The Company has informed that they will organize a conference on its 2nd quarter 2026 Financial results on July 15, 2026 at 01:00 PM via live webcast facility with the web link of https://gpworld.co/Earnings-Call-Q2-2026. Research analysts or investors can participate in the upcoming online question \u0026 answer session following the Q2'26 results announcement. To participate, please send the name and email address to investor.relations@grameenphone.com.\"},{\"id\":\"32158513\",\"type\":\"Notice\",\"date\":\"08 Jul 2026\",\"summary\":\"Board Meeting schedule under LR 16(1)\",\"body\":\"As per Regulation 16(1) of the Dhaka Stock Exchange (Listing) Regulations, 2015, the Company has informed that a meeting of the Board of Directors will be held on July 14, 2026 at 3:00 pm to consider, among others, Financial Statements for the Second Quarter (Q2) period ended June 30, 2026.\"},{\"id\":\"31479080\",\"type\":\"Dividend\",\"date\":\"24 May 2026\",\"summary\":\"Dividend Disbursement\",\"body\":\"The Company has informed that it has disbursed the Cash Dividend for the year ended December 31, 2025 to the respective shareholders.\"},{\"id\":\"30614228\",\"type\":\"Financials\",\"date\":\"23 Apr 2026\",\"summary\":\"Q1 Financials\",\"body\":\"(Q1 Un-audited): EPS was Tk. 4.90 for January-March 2026 as against Tk. 4.69 for January-March 2025. NOCFPS was Tk. 12.48 for January-March 2026 as against Tk. 14.11 for January-March 2025. NAV per share was Tk. 46.39 as on March 31, 2026 and Tk. 52.64 as on March 31, 2025. (cont.)\\n\\n(Cont. News of GP): Reasons for deviation in NOCFPS and NAVPS: Net change in NOCFPS for the quarter ended March 31, 2026 compared to that of comparative period has decreased by 11.6% mainly due to higher collection from customers in comparative period. Partially offset by lower payment to suppliers in current period. Net asset value as at 31 March 2026 increased by 11.8% compared to that of 31 December 2025 mainly due to profit for the quarter ended 31 March 2026. (end)\"},{\"id\":\"30441360\",\"type\":\"Financials\",\"date\":\"16 Apr 2026\",\"summary\":\"Conference on 1st Quarter Financial Results\",\"body\":\"The Company has informed that they will organize a conference on its 1st quarter 2026 Financial results on April 23, 2026 at 11:00 AM via live webcast facility with the web link of https://gpworld.co/Earnings-Call-Q1-2026. Research analysts or investors can participate in the upcoming online question \u0026 answer session following the Q1'26 results announcement. To participate, please send your name and email address to investor.relations@grameenphone.com.\"},{\"id\":\"30441355\",\"type\":\"Notice\",\"date\":\"16 Apr 2026\",\"summary\":\"Board Meeting schedule under LR 16(1)\",\"body\":\"As per Regulation 16(1) of the Dhaka Stock Exchange (Listing) Regulations, 2015, the Company has informed that a meeting of the Board of Directors will be held on April 22, 2026 at 3:00 PM to consider, among others, Un-Audited Financial Statements for the First Quarter (Q1) period ended March 31, 2026.\"},{\"id\":\"30113697\",\"type\":\"Financials\",\"date\":\"24 Mar 2026\",\"summary\":\"Disclosure on expected Q1 performance amid energy volatility\",\"body\":\"$29\"},{\"id\":\"29875267\",\"type\":\"Rating\",\"date\":\"03 Mar 2026\",\"summary\":\"Credit Rating Result\",\"body\":\"Credit Rating Information and Services PLC (CRISL) has assigned rating of the Company as \\\"AAA\\\" in the long term and \\\"ST-1\\\" in the short term along with Stable outlook in consideration of its audited financials up to December 31, 2025 and other relevant quantitative as well as qualitative information up to the date of rating declaration.\"},{\"id\":\"29875265\",\"type\":\"Notice\",\"date\":\"03 Mar 2026\",\"summary\":\"Resumption after Record Date\",\"body\":\"Trading of the shares of the company will resume on 04.03.2026.\"},{\"id\":\"29849610\",\"type\":\"Notice\",\"date\":\"02 Mar 2026\",\"summary\":\"Suspension for Record Date\",\"body\":\"Trading of the shares of the company will remain suspended on record date i.e., 03.03.2026.\"},{\"id\":\"29800510\",\"type\":\"Notice\",\"date\":\"26 Feb 2026\",\"summary\":\"Spot News\",\"body\":\"Trading of the shares of the company will be allowed only in the Spot Market and Block transaction will also be settled as per spot settlement cycle with cum benefit from 01.03.2026 to 02.03.2026 and trading of the shares will remain suspended on record date i.e., 03.03.2026.\"},{\"id\":\"29628027\",\"type\":\"Notice\",\"date\":\"17 Feb 2026\",\"summary\":\"Emphasis of Matter\",\"body\":\"The auditor of the company has given Emphasis of Matter paragraph in the auditor's report for the year ended December 31, 2025. To view the details, please visit: https://www.dsebd.org/Auditors_opinion/2025/184.%20Grameenphone%20Ltd_2025.pdf\"},{\"id\":\"29452689\",\"type\":\"Notice\",\"date\":\"03 Feb 2026\",\"summary\":\"Update of Information\",\"body\":\"$2a\"},{\"id\":\"29452671\",\"type\":\"Notice\",\"date\":\"03 Feb 2026\",\"summary\":\"Company receives demand note for 10 MHz spectrum in 700 MHz band from BTRC\",\"body\":\"The company has informed that it has received the demand note from the Bangladesh Telecommunication Regulatory Commission (BTRC) confirming the allocation of 10 MHz spectrum in 700 MHz band to Grameenphone Ltd. This spectrum shall be effective from 01 June 2026 and shall be valid till 10 March 2039. The total amount to be paid for the assigned spectrum is BDT 21,701,533,602 (including VAT). (cont.1)\\n\\n(Cont. News of GP): The company needs to pay the total amount in 10 equal yearly instalments of BDT 2,170,153,360 (including VAT) starting from 2026. The low-band characteristics of the 700 MHz spectrum enables wider coverage per base station site for faster and more cost-effective network expansion. (cont.2)\\n\\n(Cont. News of GP): For customers, this will provide superior indoor signal penetration by delivering more reliable connectivity inside dense urban environments. This will also significantly strengthen nationwide mobile coverage, particularly in rural, coastal, and hard-to-reach areas of Bangladesh. (end)\"},{\"id\":\"29452667\",\"type\":\"Notice\",\"date\":\"03 Feb 2026\",\"summary\":\"Price Limit Open\",\"body\":\"There will be no price limit on the trading of the shares of the Company today (03.02.2026) following its corporate declaration.\"},{\"id\":\"29452666\",\"type\":\"Dividend\",\"date\":\"03 Feb 2026\",\"summary\":\"Dividend Declaration\",\"body\":\"The Board of Directors has recommended 105% Final Cash Dividend for the year ended December 31, 2025 (i.e., total 215% Cash Dividend for the year 2025 which represents 98.16% of Profit After Tax for the year 2025 inclusive of 110% Interim Cash Dividend which has already been paid). Date of AGM: 20.04.2026, Time: 10:30 AM, Venue: Digital Platform, Record Date: 03.03.2026. (cont.)\\n\\n(Cont. News of GP): The Company has also reported EPS of Tk. 21.90, NAV per share of Tk. 41.49 and NOCFPS of Tk. 45.60 for the year ended December 31, 2025 as against Tk. 26.89, Tk. 47.95 and Tk. 45.91 respectively for the year ended December 31, 2024. (end)\"},{\"id\":\"29138073\",\"type\":\"Financials\",\"date\":\"25 Jan 2026\",\"summary\":\"Conference on Financial Results\",\"body\":\"The Company has informed that they will organize a conference on its 2025 Financial Results on February 03, 2026 at 01:00 PM via live webcast facility with the web link of https://gpworld.co/Earnings-Call-Q4-2025. Research analysts or investors can participate in the upcoming online question \u0026 answer session following the 2025 financial results announcement. To participate, please send your name and email address to investor.relations@grameenphone.com.\"},{\"id\":\"29138013\",\"type\":\"Notice\",\"date\":\"25 Jan 2026\",\"summary\":\"Board Meeting schedule under LR 19(1)\",\"body\":\"As per Regulation 19(1) of the Dhaka Stock Exchange (Listing) Regulations, 2015, the Company has informed that a meeting of the Board of Directors will be held on February 02, 2026 at 3:00 PM to consider, among others, audited financial statements of the Company for the year ended December 31, 2025.\"},{\"id\":\"29137993\",\"type\":\"Notice\",\"date\":\"25 Jan 2026\",\"summary\":\"BTRC confirming the company's eligibility for acquiring the 700 MHz spectrum\",\"body\":\"Grameenphone received an acknowledgement letter on 21 January 2026 from the Bangladesh Telecommunication Regulatory Commission (BTRC) confirming the company's eligibility for acquiring the 700 MHz spectrum. BTRC will proceed with the matter in accordance with the prevailing auction instructions, and (cont.)\\n\\n(Cont. news of GP): the necessary administrative process. Grameenphone has received confirmation of the eligibility of the said spectrum; the spectrum assignment letter will be obtained after the BTRC commission meeting in due course of time. (end)\"},{\"id\":\"26990530\",\"type\":\"Financials\",\"date\":\"27 Oct 2025\",\"summary\":\"Q3 Financials\",\"body\":\"(Q3 Un-audited): EPS was Tk. 5.56 for July-September 2025 as against Tk. 5.59 for July-September 2024; EPS was Tk. 16.77 for January-September 2025 as against Tk. 21.88 for January-September 2024. NOCFPS was Tk. 38.55 for January-September 2025 as against Tk. 38.01 for January-September 2024. NAV per share was Tk. 36.72 as on September 30, 2025 and Tk. 42.77 as on September 30, 2024. (cont.)\\n\\n(Continuation news of GP): Earnings per share for the nine months period ended 30 September 2025 has decreased by 23% compared to that of the comparative period mainly due to decrease in net profit after tax in current period. Net asset value as at 30 September 2025 has decreased by 23% compared to that of 31 December 2024 mainly due to lower accumulated profit for the nine months period ended 30 September 2025. (end)\"},{\"id\":\"26787658\",\"type\":\"Financials\",\"date\":\"20 Oct 2025\",\"summary\":\"Conference on Financial Results\",\"body\":\"The Company has informed that they will organize a conference on its Q3, 2025 Financial Results on October 28, 2025 at 01:00 PM via live webcast facility with the web link of https://gpworld.co/Earnings-Call-Q3-2025. Research analysts or investors can participate in the upcoming online question and answer session following the Q3, 2025 results announcement. To participate, please send your name and email address to investor.relations@grameenphone.com\"},{\"id\":\"26787657\",\"type\":\"Notice\",\"date\":\"20 Oct 2025\",\"summary\":\"Board Meeting schedule under LR 16(1)\",\"body\":\"As per Regulation 16(1) of the Dhaka Stock Exchange (Listing) Regulations, 2015, the Company has informed that a meeting of the Board of Directors will be held on October 26, 2025 at 6:00 PM to consider, among others, financial statements of the Company for the Third Quarter (Q3) period ended September 30, 2025.\"},{\"id\":\"26439261\",\"type\":\"Dividend\",\"date\":\"23 Sep 2025\",\"summary\":\"Interim Dividend Disbursement\",\"body\":\"The Company has informed that it has disbursed the Interim Cash Dividend based on 6 months financials for the period ended June 30, 2025 to the respective shareholders.\"}],\"disclosuresNextCursor\":\"26439261\"}\n"])</script></body></html>
