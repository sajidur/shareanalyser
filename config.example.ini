# Copy to config.ini (or run `python run.py setup`, which writes it for you).

[mysql]
host = 127.0.0.1
port = 3306
user = root
password =
database = bd_stock

[server]
host = 127.0.0.1
port = 8050
# allowed_hosts = 192.168.0.10   (only if you bind host = 0.0.0.0 to use it from your phone on Wi-Fi)

[monitor]
# Price refresh interval while DSE is open (dashboard running)
intraday_interval_minutes = 5
# End-of-day run starts this many minutes after DSE's post-closing session
eod_delay_minutes = 10
# Pause between company-page downloads during history backfill
backfill_delay_seconds = 0.8

[dse]
base_url = https://www.dse.com.bd
timeout_seconds = 30
